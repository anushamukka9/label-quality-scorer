[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "label-quality-scorer"
version = "1.0.0"
description = "Label quality scoring: inter-annotator agreement (Cohen's/Fleiss' kappa), annotator reliability profiles, disagreement hotspots, class-imbalance diagnostics, suspicious-label detection, and a ranked review queue — with CLI for CSV/JSONL"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Anusha Mukka", email = "hello@anushamukka.com" },
]
keywords = ["data-labeling", "annotation-quality", "inter-annotator-agreement", "kappa", "mlops", "data-quality"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.22",
]

[project.urls]
Homepage = "https://anushamukka.com"
Repository = "https://github.com/anushamukka9/label-quality-scorer"

[project.scripts]
label-quality-scorer = "label_quality_scorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
